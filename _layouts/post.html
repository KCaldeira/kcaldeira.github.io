---
layout: default
---
<article class="post wrap">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%-d %B %Y" }}
      </time>
    </p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <nav class="post-nav" aria-label="Other posts">
    {% if page.previous %}
      <a class="prev" href="{{ page.previous.url | relative_url }}">
        <span>Previous</span>{{ page.previous.title }}
      </a>
    {% endif %}
    {% if page.next %}
      <a class="next" href="{{ page.next.url | relative_url }}">
        <span>Next</span>{{ page.next.title }}
      </a>
    {% endif %}
  </nav>
</article>
